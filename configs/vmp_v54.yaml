version: VMP-v5.4
pipeline: shared_local_vllm_symbolic_span_binding

candidate_generation:
  dev_source_run: outputs/longmemeval/runs/lme_dev_vmp_v532_candidates_seed42
  source_model: outputs/longmemeval/models/vmp_v5_seed42.json
  comparison_model: outputs/longmemeval/models/vmp_v43_seed42.json
  methods:
    - vmp_tuned
    - vmp_hierarchical
  retrieval_pool_count: 40
  unique_candidate_count: 30
  output_top_k: 5
  deduplicate_by: source_session_id
  strict_unique_candidate_preflight: true

selector:
  provider: vllm
  model: Qwen/Qwen2.5-7B-Instruct
  prompt_version: vmp_v54_symbolic_span_selector_v1
  candidate_labels: C01..C30
  evidence_span_labels: Cxx:Sxx
  expose_session_ids_to_llm: false
  derive_promotion_owner_from_evidence_span: true
  require_grounded_span_for_out_of_top5_promotion: true
  temperature: 0.0
  top_p: 1.0
  max_tokens: 512
  protected_top_n: 3
  ranked_output_count: 10
  max_candidate_chars: 1600
  max_excerpt_turns: 6

boundary_verifier:
  prompt_version: vmp_v54_symbolic_span_boundary_v1
  protected_top_n: 3
  max_promotions: 2
  selectable_labels:
    - B1
    - B2
    - P1
    - P2
  evidence_span_labels: SLOT:Sxx
  protected_labels:
    - LOCKED-1
    - LOCKED-2
    - LOCKED-3
  verify_span_owner_locally: true
  expose_session_ids_to_llm: false
  min_confidence: high
  max_tokens: 512
  parse_failure_policy: preserve_original_top5
  span_validation_failure_policy: preserve_original_top5
  low_confidence_policy: preserve_original_top5

dev_gate:
  min_recall_all_at_5: 0.93
  min_delta_vs_raw_v5: 0.025
  min_delta_vs_shared_reranked_v43: 0.03
  min_macro_delta_vs_raw_v5: 0.0
  max_type_regression_vs_raw_v5: 0.03
  max_parse_fallback_rate: 0.02
  max_boundary_fallback_rate: 0.02
  max_regressed_questions: 0
  min_recovered_questions: 3
  min_unique_candidate_count: 30
  test_labels_used: false

fairness:
  shared_candidate_run: true
  shared_selector_prompt: true
  shared_boundary_prompt: true
  shared_generation: true
  shared_reader: true
  framework_name_visible_to_llm: false
  gold_labels_visible_to_llm: false
  test_labels_used_for_selection: false
