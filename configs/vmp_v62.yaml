version: VMP-v6.2
base_config: configs/vmp_v6.yaml
pipeline: partial_atomic_fact_extraction_and_deterministic_set_coverage

frozen_components:
  dev_source_run: outputs/longmemeval/runs/lme_dev_vmp_v532_candidates_seed42
  candidate_planner_version: vmp_v55_dual_view_rrf_v1
  candidate_count: 10
  model: Qwen/Qwen2.5-7B-Instruct
  output_top_k: 5
  protected_top_n: 3
  temperature: 0.0
  top_p: 1.0
  gold_labels_visible: false
  benchmark_answers_visible: false

evidence_perception:
  selector_prompt_version: vmp_v62_partial_atomic_fact_extractor_v2
  excerpt_version: role_aware_fact_v3
  boundary_version: vmp_v62_deterministic_set_coverage_v2
  calls_per_sample: 10
  scalar_one_item_fields_accepted: true
  temporal_anchor_inference: explicit_temporal_relation_and_value_only
  partial_evidence_required: true
  fixed_label_free_aliases: true
  benchmark_labels_visible: false

set_coverage:
  enumerate_open_slot_combinations: true
  open_slots: 2
  min_gain: 0.25
  need_weight: 3.0
  relevance_weight: 1.5
  entity_diversity_weight: 1.25
  temporal_coverage_weight: 1.25
  rank_prior_weight: 0.08
  tie_break: earliest_candidate_rank

dev_gate:
  min_recall_all_at_5: 0.93
  min_delta_vs_raw_v5: 0.025
  min_delta_vs_shared_reranked_v43: 0.03
  min_macro_delta_vs_raw_v5: 0.0
  max_type_regression_vs_raw_v5: 0.03
  max_parse_fallback_rate: 0.02
  max_selector_call_fallback_rate: 0.02
  max_regressed_questions: 0
  min_recovered_questions: 3
  min_unique_candidate_count: 10
  test_labels_used: false

offline_replay:
  script: scripts/tune_v6_coverage.py
  reparse_raw_responses_supported: true
  fresh_vllm_calls_required: false
